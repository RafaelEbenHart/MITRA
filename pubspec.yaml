name: mitra
description: MITRA - Aplikasi Manajemen Inventory dan Transaksi Retail.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.4.0
  get_it: ^7.6.7
  equatable: ^2.0.5

  # Functional Programming
  fpdart: ^1.1.0

  # Code Generation Annotations
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^14.0.0

  # Firebase
  firebase_core: ^2.18.0
  firebase_auth: ^4.17.5
  cloud_firestore: ^4.17.5

  # UI & Utilities
  google_fonts: ^6.1.0
  vibration: ^3.1.8
  intl: ^0.19.0
  permission_handler: ^11.3.1

  # Scanner & Printer
  pretty_qr_code: ^3.3.0
  print_bluetooth_thermal: ^1.1.2
  mobile_scanner: ^5.1.0
  pdf: ^3.12.0
  printing: ^5.9.0
  uuid: ^4.5.2
  app_settings: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

  # Code Generation
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - lib/Images/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "lib/Images/appIcon.jpeg"
